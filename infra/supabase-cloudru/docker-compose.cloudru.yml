services:
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000"

  storage:
    environment:
      FILE_SIZE_LIMIT: "5368709120"
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:?Set the private Cloud.ru bucket}
      GLOBAL_S3_ENDPOINT: ${AWS_ENDPOINT_URL:-https://s3.cloud.ru}
      GLOBAL_S3_PROTOCOL: https
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set the tenant-prefixed access key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set the storage secret}
      REGION: ${AWS_DEFAULT_REGION:-ru-central-1}

  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"
