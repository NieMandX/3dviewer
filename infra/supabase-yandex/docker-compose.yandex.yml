services:
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000"

  storage:
    environment:
      FILE_SIZE_LIMIT: "5368709120"
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      GLOBAL_S3_ENDPOINT: ${GLOBAL_S3_ENDPOINT}
      GLOBAL_S3_PROTOCOL: https
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${YC_STORAGE_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${YC_STORAGE_SECRET_ACCESS_KEY}
      REGION: ${YC_STORAGE_REGION:-ru-central1}

  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"
